<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trợ lý của Dũng</title>
  <!-- Thư viện bắt buộc của Microsoft Office.js -->
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 12px;
      background-color: #f8f9fa;
      color: #333;
    }
    .app-container {
      display: flex;
      flex-direction: column;
      height: 94vh;
    }
    h3 {
      margin: 0 0 12px 0;
      color: #1a73e8;
      font-size: 16px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 8px;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
    }
    input[type="password"], select, textarea {
      width: 100%;
      padding: 7px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 13px;
    }
    .chat-box {
      flex: 1;
      background: #ffffff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 10px;
      overflow-y: auto;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .msg {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 13px;
      line-height: 1.4;
      max-width: 90%;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .user-msg {
      background-color: #e8f0fe;
      color: #1967d2;
      align-self: flex-end;
    }
    .ai-msg {
      background-color: #f1f3f4;
      color: #202124;
      align-self: flex-start;
    }
    .options-row {
      margin: 6px 0;
    }
    .checkbox-label {
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    button {
      width: 100%;
      padding: 9px;
      background-color: #1a73e8;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      background-color: #1557b0;
    }
    button:disabled {
      background-color: #a0c3ff;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <h3>✨ Trợ lý của Dũng</h3>

    <div class="form-group">
      <label for="apiKey">🔑 Gemini API Key:</label>
      <input type="password" id="apiKey" placeholder="Nhập API Key từ Google AI Studio..." />
    </div>

    <div class="form-group">
      <label for="modelSelect">🤖 Chọn Model:</label>
      <select id="modelSelect">
        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite (Nhanh & Tối ưu)</option>
        <option value="gemini-3.1-pro">Gemini 3.1 Pro (Phân tích & Hàm phức tạp)</option>
        <option value="gemini-3.8-flash">Gemini 3.8 Toàn diện</option>
        <option value="gemini-4.0-Argon">Gemini 4.0 Argon</option>
      </select>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msg ai-msg">Xin chào! Hãy bôi đen một vùng dữ liệu trên Excel và yêu cầu tôi phân tích, viết hàm hoặc chỉnh sửa trực tiếp nhé!</div>
    </div>

    <div class="input-section">
      <textarea id="userInput" rows="3" placeholder="VD: Tính tổng cột B, hoặc tạo bảng danh sách 5 nhân viên kèm lương..."></textarea>
      <div class="options-row">
        <label class="checkbox-label">
          <input type="checkbox" id="applyToExcel" checked />
          Cho phép Gemini sửa trực tiếp vào ô đang chọn
        </label>
      </div>
      <button id="sendBtn">Gửi yêu cầu</button>
    </div>
  </div>

  <script>
    // Khởi tạo Office Add-in
    Office.onReady((info) => {
      if (info.host === Office.HostType.Excel) {
        document.getElementById("sendBtn").addEventListener("click", handleSend);

        const apiKeyInput = document.getElementById("apiKey");
        if (localStorage.getItem("gemini_excel_api_key")) {
          apiKeyInput.value = localStorage.getItem("gemini_excel_api_key");
        }
        apiKeyInput.addEventListener("change", () => {
          localStorage.setItem("gemini_excel_api_key", apiKeyInput.value.trim());
        });
      }
    });

    function appendMessage(text, isUser) {
      const chatBox = document.getElementById("chatBox");
      const msgDiv = document.createElement("div");
      msgDiv.className = "msg " + (isUser ? "user-msg" : "ai-msg");
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function handleSend() {
      const apiKey = document.getElementById("apiKey").value.trim();
      const model = document.getElementById("modelSelect").value;
      const userInput = document.getElementById("userInput").value.trim();
      const applyToExcel = document.getElementById("applyToExcel").checked;
      const sendBtn = document.getElementById("sendBtn");

      if (!apiKey) {
        appendMessage("⚠️ Vui lòng nhập Gemini API Key trước khi sử dụng!", false);
        return;
      }
      if (!userInput) return;

      appendMessage(userInput, true);
      document.getElementById("userInput").value = "";
      sendBtn.disabled = true;
      sendBtn.innerText = "Đang xử lý...";

      try {
        await Excel.run(async (context) => {
          const range = context.workbook.getSelectedRange();
          range.load(["address", "values", "formulas", "rowCount", "columnCount"]);
          await context.sync();

          const systemPrompt = `
Bạn là trợ lý chuyên gia Microsoft Excel được tích hợp trực tiếp vào bảng tính.
Thông tin vùng ô người dùng đang chọn trên Excel:
- Địa chỉ vùng: ${range.address}
- Kích thước: ${range.rowCount} hàng x ${range.columnCount} cột
- Giá trị hiện tại (Values): ${JSON.stringify(range.values)}
- Công thức hiện tại (Formulas): ${JSON.stringify(range.formulas)}

Yêu cầu từ người dùng: "${userInput}"

Hãy trả lời BẮT BUỘC dưới định dạng JSON hợp lệ theo cấu trúc sau:
{
  "reply": "Câu trả lời, giải thích chi tiết hoặc kết quả phân tích để hiển thị trong khung chat",
  "shouldUpdateExcel": true hoặc false,
  "excelData": [
    ["Giá trị hoặc công thức ô (0,0)", "Giá trị hoặc công thức ô (0,1)"]
  ]
}
Lưu ý: Nếu chèn công thức Excel, bắt đầu bằng dấu "=" và dùng dấu phẩy (,) ngăn cách đối số. Nếu không sửa bảng tính, để "excelData": [].`;

          const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
          const response = await fetch(url, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: systemPrompt }] }],
              generationConfig: { responseMimeType: "application/json" }
            })
          });

          const data = await response.json();
          if (data.error) throw new Error(data.error.message);

          const result = JSON.parse(data.candidates[0].content.parts[0].text);
          appendMessage(result.reply, false);

          if (applyToExcel && result.shouldUpdateExcel && Array.isArray(result.excelData) && result.excelData.length > 0) {
            const numRows = result.excelData.length;
            const numCols = result.excelData[0].length;
            const targetRange = range.getCell(0, 0).getResizedRange(numRows - 1, numCols - 1);
            targetRange.formulas = result.excelData;
            await context.sync();
            appendMessage(`✅ Đã cập nhật dữ liệu/công thức vào vùng ${numRows}x${numCols} từ ô đầu của ${range.address}.`, false);
          }
        });
      } catch (error) {
        appendMessage("❌ Lỗi: " + error.message, false);
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerText = "Gửi yêu cầu";
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/es6-promise@4/dist/es6-promise.auto.min.js"></script>
  <script>
    var currentHost = null;

    Office.onReady(function (info) {
      currentHost = info.host;
      document.getElementById("sendBtn").onclick = handleSend;

      // Đổi tiêu đề tự động theo phần mềm đang mở
      var titleEl = document.querySelector("h3");
      if (currentHost === Office.HostType.Word) {
        titleEl.innerText = "✨ Gemini Word Assistant";
        document.getElementById("userInput").placeholder = "VD: Viết lại đoạn văn đang bôi đen, tóm tắt, dịch thuật hoặc soạn hợp đồng...";
      }

      var apiKeyInput = document.getElementById("apiKey");
      var savedKey = localStorage.getItem("gemini_office_api_key");
      if (savedKey) apiKeyInput.value = savedKey;
      apiKeyInput.onchange = function () {
        localStorage.setItem("gemini_office_api_key", apiKeyInput.value.trim());
      };
    });

    function appendMessage(text, isUser) {
      var chatBox = document.getElementById("chatBox");
      var msgDiv = document.createElement("div");
      msgDiv.className = "msg " + (isUser ? "user-msg" : "ai-msg");
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function callGeminiAPI(url, payload, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open("POST", url, true);
      xhr.setRequestHeader("Content-Type", "application/json");
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          if (xhr.status >= 200 && xhr.status < 300) {
            callback(null, JSON.parse(xhr.responseText));
          } else {
            callback(new Error("Lỗi API (" + xhr.status + "): " + xhr.responseText));
          }
        }
      };
      xhr.send(JSON.stringify(payload));
    }

    function handleSend() {
      var apiKey = document.getElementById("apiKey").value.trim();
      var model = document.getElementById("modelSelect").value;
      var userInput = document.getElementById("userInput").value.trim();
      var applyToDoc = document.getElementById("applyToExcel").checked;
      var sendBtn = document.getElementById("sendBtn");

      if (!apiKey) {
        appendMessage("⚠️ Vui lòng nhập Gemini API Key!", false);
        return;
      }
      if (!userInput) return;

      appendMessage(userInput, true);
      document.getElementById("userInput").value = "";
      sendBtn.disabled = true;
      sendBtn.innerText = "Đang xử lý...";

      if (currentHost === Office.HostType.Excel) {
        runInExcel(apiKey, model, userInput, applyToDoc, sendBtn);
      } else if (currentHost === Office.HostType.Word) {
        runInWord(apiKey, model, userInput, applyToDoc, sendBtn);
      } else {
        appendMessage("❌ Ứng dụng chưa được hỗ trợ.", false);
        sendBtn.disabled = false;
        sendBtn.innerText = "Gửi yêu cầu";
      }
    }

    // XỬ LÝ TRÊN WORD
    function runInWord(apiKey, model, userInput, applyToWord, sendBtn) {
      Word.run(function (context) {
        var selection = context.document.getSelection();
        selection.load("text");

        return context.sync().then(function () {
          var selectedText = selection.text || "(Không bôi đen văn bản nào)";
          var systemPrompt =
            "Bạn là trợ lý soạn thảo Microsoft Word chuyên nghiệp.\n" +
            "Đoạn văn bản người dùng đang bôi đen trong Word:\n\"\"\"\n" + selectedText + "\n\"\"\"\n\n" +
            "Yêu cầu của người dùng: \"" + userInput + "\"\n\n" +
            "Trả lời BẮT BUỘC dưới dạng JSON hợp lệ theo cấu trúc:\n" +
            "{\n" +
            "  \"reply\": \"Câu trả lời hoặc giải thích hiển thị trong khung chat\",\n" +
            "  \"shouldUpdateWord\": true hoặc false (true nếu người dùng yêu cầu viết mới, viết lại, sửa lỗi, dịch và chèn vào tài liệu),\n" +
            "  \"wordText\": \"Nội dung văn bản hoàn chỉnh sẽ chèn/thay thế trực tiếp vào Word\"\n" +
            "}";

          var url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + apiKey;
          var payload = {
            contents: [{ parts: [{ text: systemPrompt }] }],
            generationConfig: { responseMimeType: "application/json" }
          };

          callGeminiAPI(url, payload, function (err, data) {
            if (err) {
              appendMessage("❌ " + err.message, false);
              sendBtn.disabled = false;
              sendBtn.innerText = "Gửi yêu cầu";
              return;
            }
            try {
              var result = JSON.parse(data.candidates[0].content.parts[0].text);
              appendMessage(result.reply, false);

              if (applyToWord && result.shouldUpdateWord && result.wordText) {
                Word.run(function (writeCtx) {
                  var range = writeCtx.document.getSelection();
                  range.insertText(result.wordText, Word.InsertLocation.replace);
                  return writeCtx.sync().then(function () {
                    appendMessage("✅ Đã chèn/cập nhật nội dung trực tiếp vào tài liệu Word.", false);
                  });
                });
              }
            } catch (e) {
              appendMessage("❌ Lỗi xử lý phản hồi: " + e.message, false);
            }
            sendBtn.disabled = false;
            sendBtn.innerText = "Gửi yêu cầu";
          });
        });
      }).catch(function (error) {
        appendMessage("❌ Lỗi Word: " + error.message, false);
        sendBtn.disabled = false;
        sendBtn.innerText = "Gửi yêu cầu";
      });
    }

    // XỬ LÝ TRÊN EXCEL
    function runInExcel(apiKey, model, userInput, applyToExcel, sendBtn) {
      Excel.run(function (context) {
        var range = context.workbook.getSelectedRange();
        range.load(["address", "values", "formulas", "rowCount", "columnCount"]);

        return context.sync().then(function () {
          var systemPrompt =
            "Bạn là trợ lý chuyên gia Microsoft Excel.\n" +
            "Vùng đang chọn: " + range.address + " (" + range.rowCount + "x" + range.columnCount + ")\n" +
            "Giá trị (Values): " + JSON.stringify(range.values) + "\n" +
            "Công thức (Formulas): " + JSON.stringify(range.formulas) + "\n\n" +
            "Yêu cầu: \"" + userInput + "\"\n\n" +
            "Trả lời BẮT BUỘC dưới dạng JSON hợp lệ:\n" +
            "{\n" +
            "  \"reply\": \"Câu trả lời hiển thị trong khung chat\",\n" +
            "  \"shouldUpdateExcel\": true hoặc false,\n" +
            "  \"excelData\": [[\"Giá trị hoặc công thức ô (0,0)\"]]\n" +
            "}";

          var url = "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + apiKey;
          var payload = {
            contents: [{ parts: [{ text: systemPrompt }] }],
            generationConfig: { responseMimeType: "application/json" }
          };

          callGeminiAPI(url, payload, function (err, data) {
            if (err) {
              appendMessage("❌ " + err.message, false);
              sendBtn.disabled = false;
              sendBtn.innerText = "Gửi yêu cầu";
              return;
            }
            try {
              var result = JSON.parse(data.candidates[0].content.parts[0].text);
              appendMessage(result.reply, false);

              if (applyToExcel && result.shouldUpdateExcel && result.excelData && result.excelData.length > 0) {
                Excel.run(function (writeCtx) {
                  var activeRange = writeCtx.workbook.getSelectedRange();
                  var numRows = result.excelData.length;
                  var numCols = result.excelData[0].length;
                  var targetRange = activeRange.getCell(0, 0).getResizedRange(numRows - 1, numCols - 1);
                  targetRange.formulas = result.excelData;
                  return writeCtx.sync().then(function () {
                    appendMessage("✅ Đã cập nhật vùng " + numRows + "x" + numCols + " trên Excel.", false);
                  });
                });
              }
            } catch (e) {
              appendMessage("❌ Lỗi xử lý phản hồi: " + e.message, false);
            }
            sendBtn.disabled = false;
            sendBtn.innerText = "Gửi yêu cầu";
          });
        });
      }).catch(function (error) {
        appendMessage("❌ Lỗi Excel: " + error.message, false);
        sendBtn.disabled = false;
        sendBtn.innerText = "Gửi yêu cầu";
      });
    }
  </script>
  </script>
</body>
</html>
